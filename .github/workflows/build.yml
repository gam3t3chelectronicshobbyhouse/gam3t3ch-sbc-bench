name: Baseline checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgles2-mesa-dev
      - name: Build native tools including GLES 2
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          test -x build/g3bench-gpu
      - name: Tests and installer syntax
        run: |
          python3 -m unittest discover -s tests -v
          bash -n install.sh
