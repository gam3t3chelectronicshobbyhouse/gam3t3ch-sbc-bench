name: Baseline checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgles2-mesa-dev fio xvfb xauth mesa-utils iperf3
      - name: Build native tools including GLES 2
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          test -x build/g3bench-gpu
      - name: Validate real GLES shader compilation and linking under Mesa
        run: |
          xvfb-run -a env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 python3 -c "import subprocess,json; p=subprocess.run(['build/g3bench-gpu','--probe','--windowed'],capture_output=True,text=True,timeout=30); print('return',p.returncode,'stdout',repr(p.stdout),'stderr',p.stderr); r=json.loads(p.stdout); assert r['status']=='ready',r"
      - name: Tests and installer syntax
        env:
          G3BENCH_RUN_SOCKET_TESTS: '1'
        run: |
          python3 -m unittest discover -s tests -v
          bash -n install.sh
      - name: Validate optional Godot scene headlessly
        run: |
          curl -fL --retry 2 -o build/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q build/godot.zip -d build/godot
          python3 -m g3bench showcase --godot "$PWD/build/godot/Godot_v4.4.1-stable_linux.x86_64" --smoke-test --as-configured --output build/showcase-smoke
          python3 -c "import json,pathlib; r=json.loads(next(pathlib.Path('build/showcase-smoke').glob('*/result.json')).read_text()); assert r['test_status']['showcase']['status']=='smoke_validated'; assert not r['comparison_eligible']; assert all(v is None for v in r['scores'].values())"
