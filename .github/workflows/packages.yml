name: Standalone packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated build tools
        run: python -m pip install pyinstaller==6.16.0 ziglang==0.16.0
      - name: Build self-contained app and user installer
        shell: pwsh
        run: |
          $zig = python -c "import pathlib,ziglang; print(pathlib.Path(ziglang.__file__).parent/'zig.exe')"
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler is missing from the runner image' }
          python distribution/build_bundle.py --compiler $zig --iscc $iscc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test packaged native worker and embedded Godot
        shell: pwsh
        run: |
          $app = "$PWD\build\dist\windows-x86_64\GAM3T3CH\GAM3T3CH.exe"
          Start-Process -FilePath $app -ArgumentList @('quick','--headless','--as-configured','--output',"$PWD\build\frozen-native") -Wait -WindowStyle Hidden
          Start-Process -FilePath $app -ArgumentList @('showcase','--smoke-test','--as-configured','--output',"$PWD\build\frozen-showcase") -Wait -WindowStyle Hidden
          python distribution/check_bundle.py build/frozen-native build/frozen-showcase
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1",[ref]$null,[ref]$errors) | Out-Null
          if ($errors.Count) { throw 'PowerShell installer syntax failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/packages/*
          if-no-files-found: error
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-dev gcc binutils patchelf pkg-config libsdl2-dev libgles2-mesa-dev curl ca-certificates
          python3 -m venv build/package-venv
          build/package-venv/bin/pip install pyinstaller==6.16.0
      - name: Build self-contained app with embedded Godot
        run: build/package-venv/bin/python distribution/build_bundle.py
      - name: Test packaged native worker and embedded Godot
        run: |
          build/dist/linux-${{ matrix.arch }}/GAM3T3CH/GAM3T3CH quick --headless --as-configured --output build/frozen-native
          build/dist/linux-${{ matrix.arch }}/GAM3T3CH/GAM3T3CH showcase --smoke-test --as-configured --output build/frozen-showcase
          python3 distribution/check_bundle.py build/frozen-native build/frozen-showcase
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: true
